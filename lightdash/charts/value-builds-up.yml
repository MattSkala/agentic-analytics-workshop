contentType: chart
description: Day 0 is the first visit alone. Channels worth at least $1 per new visitor over 90 days.
metricQuery:
  dimensions:
    - visitor_value_curve_days_since_first_visit
    - visitor_value_curve_first_channel
  exploreName: visitor_value_curve
  filters:
    dimensions:
      and:
        - operator: equals
          target:
            fieldId: visitor_value_curve_first_channel
          values:
            - Referral
            - Display
            - Direct
            - Paid Search
            - Organic Search
  limit: 100
  metrics:
    - visitor_value_curve_value_per_visitor_to_date
  sorts:
    - descending: false
      fieldId: visitor_value_curve_days_since_first_visit
  tableCalculations: []
name: Value keeps arriving after the first visit
pivotConfig:
