      content: |
        Revenue per **genuinely new** visitor, credited to the channel of the
        first visit. Only visitors whose first-ever visit falls between
        1 Aug 2016 and 3 May 2017 count, so everyone has a full 90 days.
        This is revenue, not margin: multiply by your margin before bidding.
